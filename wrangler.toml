name = "modo-stays"
compatibility_date = "2026-11-01"
pages_build_output_dir = "dist"

# ==============================================================================
# DATABASE CLOUDFLARE KV (MODO_DB)
# ==============================================================================
# Per rendere permanenti prenotazioni, prezzi, descrizioni e link .ics:
# 1. Su Cloudflare Dashboard vai su: Storage & Databases -> KV -> Create
# 2. Chiamalo "MODO_DB"
# 3. Apri il tuo progetto Pages -> Settings -> Bindings -> Add -> KV Namespace
#    Variable name: MODO_DB  |  KV Namespace: MODO_DB
# Se invece usi Wrangler da terminale, decommenta le 3 righe sotto con il tuo ID:
# [[kv_namespaces]]
# binding = "MODO_DB"
# id = "INSERISCI_QUI_IL_TUO_KV_NAMESPACE_ID"
